name: "IP 纯净度"
description: "用 IPPure 检测出口 IP 的风险分、原生/广播、住宅/机房、地区和 ASN"
author: "vfelix7"
icon: "shield.lefthalf.filled"

env_schema:
  POLICY:
    name: "检测策略"
    description: "检测哪个策略组或节点的出口 IP（如 Proxy、香港）；留空按 Egern 分流规则"
  MARK_IP:
    name: "IP 打码"
    description: "隐藏 IP 中间段，默认开启"
    default_value: "true"
    options:
      - "true"
      - "false"
  REFRESH_MINUTES:
    name: "刷新间隔（分钟）"
    default_value: "10"
  LABEL:
    name: "名称"
    description: "显示在 IP 右边，用来区分多个小组件；不填时显示检测策略名"

scriptings:
  - generic:
      name: "ip-purity-widget"
      script_url: "https://raw.githubusercontent.com/vfelix7/rule_module_script/refs/heads/master/egern/scripts/IP_Purity_Widget.js"
      update_interval: 300
      timeout: 15

widgets:
  - name: "IP 纯净度"
    script_name: "ip-purity-widget"

# 不填任何 Env 也能用：检测 my.ippure.com 按分流规则走到的那个出口。
# 想看某个落地节点的 IP，在「检测策略」里填它的节点名或策略组名。
# 数据来自 https://my.ippure.com/v1/info
